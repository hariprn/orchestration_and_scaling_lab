apiVersion: apps/v1
kind: Deployment

metadata:
  name: auth-service
  namespace: streamingapp

spec:
  replicas: 2

  selector:
    matchLabels:
      app: auth-service

  template:
    metadata:
      labels:
        app: auth-service

    spec:
      containers:
      - name: auth-service

        image: 610405653088.dkr.ecr.ap-south-1.amazonaws.com/streamingapp-auth:latest

        ports:
        - containerPort: 3001

        env:
        - name: PORT
          value: "3001"

        - name: MONGO_URI
          value: "mongodb://mongo:27017/streamingapp"

        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: app-secret
              key: JWT_SECRET

---
apiVersion: v1
kind: Service

metadata:
  name: auth-service
  namespace: streamingapp

spec:
  selector:
    app: auth-service

  ports:
  - port: 3001
    targetPort: 3001
