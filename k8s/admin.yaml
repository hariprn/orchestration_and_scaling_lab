apiVersion: apps/v1
kind: Deployment

metadata:
  name: admin-service
  namespace: streamingapp

spec:
  replicas: 2

  selector:
    matchLabels:
      app: admin-service

  template:
    metadata:
      labels:
        app: admin-service

    spec:
      containers:
      - name: admin-service

        image: 610405653088.dkr.ecr.ap-south-1.amazonaws.com/streamingapp-admin:latest

        ports:
        - containerPort: 3003

        env:
        - name: PORT
          value: "3003"

        - name: MONGO_URI
          value: "mongodb://mongo:27017/streamingapp"

        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: app-secret
              key: JWT_SECRET

---
apiVersion: v1
kind: Service

metadata:
  name: admin-service
  namespace: streamingapp

spec:
  selector:
    app: admin-service

  ports:
  - port: 3003
    targetPort: 3003
